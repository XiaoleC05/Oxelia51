[package]
name = "oxelia51-desktop"
version = "0.1.0"
description = "Oxelia51 本地优先的个人 Token 记账本"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "oxelia51_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
