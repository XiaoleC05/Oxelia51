name: Build and Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# 默认权限：仅读。release job 单独提升写权限。
permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: |
            backend/go.sum
            proxy-gateway/go.sum

      - name: Backend vet
        working-directory: backend
        run: go vet ./...

      - name: Backend test
        working-directory: backend
        run: go test -v -count=1 ./...

      - name: Backend cross-compile (linux/amd64)
        working-directory: backend
        run: |
          mkdir -p ../release/backend
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o ../release/backend/oxelia51-server ./cmd/server
          cp -r migrations ../release/backend/migrations

      - name: Proxy cross-compile (linux/amd64)
        working-directory: proxy-gateway
        run: |
          mkdir -p ../release/proxy
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o ../release/proxy/proxy-server ./cmd/proxy

      - name: Analytics cross-compile (linux/amd64)
        working-directory: analytics
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcurl4-openssl-dev
          mkdir -p ../release/analytics
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          cp build/token-analytics ../release/analytics/

      - name: Stage deploy scripts
        run: cp -r deploy release/deploy

      - name: Verify release structure
        run: |
          test -f release/backend/oxelia51-server
          test -f release/proxy/proxy-server
          test -f release/analytics/token-analytics
          test -f release/backend/migrations/003_auth_v11.up.sql
          test -f release/deploy/apply-release.sh
          echo "release structure OK"

      - name: Package release tarball
        run: tar czf oxelia51-release.tar.gz -C release .

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: oxelia-release
          path: oxelia51-release.tar.gz
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build-test
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: oxelia-release

      - name: Create Release and Upload Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="release-$(date +%Y%m%d%H%M%S)"
          gh release create "$TAG" oxelia51-release.tar.gz \
            --title "Release ${GITHUB_SHA::7}" \
            --notes "Automated release. Commit: ${GITHUB_SHA}" \
            --target master \
            --latest
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

      # 防止 release-* 部署版在 Releases 页堆积：仅保留最新 2 个（含本次）
      - name: Prune old deployment releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName,isLatest \
            --jq '[.[] | select(.tagName | startswith("release-")) | select(.isLatest | not) | .tagName] | .[1:][]' \
            | while read -r old; do
                gh release delete "$old" --yes --cleanup-tag || true
              done
