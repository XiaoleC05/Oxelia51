name: Build and Push to ACR

on:
  workflow_dispatch:

jobs:
  push-to-acr:
    name: Build & Push to Aliyun ACR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # web/ 已迁入本仓（Oxelia51），直接构建当前仓库
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -f web/Dockerfile -t langfuse-token-web:latest .

      - name: Push to ACR
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          docker tag langfuse-token-web:latest "$ACR_REGISTRY/oxelia51/langfuse-token:latest"
          echo "$ACR_PASSWORD" | docker login --username "$ACR_USERNAME" --password-stdin "$ACR_REGISTRY"
          docker push "$ACR_REGISTRY/oxelia51/langfuse-token:latest"
          echo "PUSH_DONE"
