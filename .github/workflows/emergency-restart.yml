# 紧急恢复：在阿里云 self-hosted runner 上修复 Go 后端（exec API 依赖 Go 后端，
# 后端挂时无法远程运维，此通道绕过 exec 直接操作服务器）。
# 2026-08-06: 后端崩溃根因是误加入的 015_feedback 迁移（阿里云 DB 无 oxelia51 schema），
# 本 workflow 删除该迁移文件并重启后端。
name: Emergency Restart
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/emergency-restart.yml"

jobs:
  restart-backend:
    runs-on: self-hosted
    steps:
      - name: Remove bad migration and restart Go backend
        run: |
          rm -f /opt/Oxelia51/backend/migrations/015_feedback.up.sql \
                /opt/Oxelia51/backend/migrations/015_feedback.down.sql
          systemctl restart oxelia51-backend
          sleep 4
          systemctl is-active oxelia51-backend
          echo "health: $(curl -s --max-time 5 http://127.0.0.1:8080/api/health | head -c 120)"
          echo "RECOVERY-DONE"
