name: Desktop Build (Windows/macOS/Linux)

# 桌面应用三平台打包（P3.3）。
# 触发：push v* 版本 tag（正式发布）或手动 dispatch。
# 产物以 GitHub Release 附件上传，供 /download 页使用。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  desktop:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: nsis
          - platform: macos-14        # Apple Silicon
            bundles: dmg
          - platform: ubuntu-latest
            bundles: deb,rpm,appimage
    env:
      UI_DIR: desktop/ui
      SRC_TAURI: desktop/src-tauri
      GATEWAY: proxy-gateway

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go (sidecar)
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: ${{ env.GATEWAY }}/go.sum

      - name: Set up Rust (Tauri)
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node (UI)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.UI_DIR }}/package-lock.json

      - name: Install Linux webkit deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # 构建 Go sidecar 到 Tauri externalBin 期望位置（proxy-<target-triple>）
      # -ldflags：注入构建版本（tag 去 v 前缀）；Windows 加 -H windowsgui（GUI 子系统），
      #   使 Run-key 独立启动后台代理时不弹控制台窗口。
      - name: Build Go sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          TRIPLE="x86_64-pc-windows-msvc"
          cd ${{ env.GATEWAY }}
          go build -ldflags "-H windowsgui -X github.com/XiaoleC05/Oxelia51/proxy-gateway/internal/version.V=${GITHUB_REF_NAME#v}" -o ../desktop/src-tauri/proxy-${TRIPLE}.exe ./cmd/proxy

      - name: Build Go sidecar (macOS)
        if: matrix.platform == 'macos-14'
        run: |
          TRIPLE="aarch64-apple-darwin"
          cd ${{ env.GATEWAY }}
          go build -ldflags "-X github.com/XiaoleC05/Oxelia51/proxy-gateway/internal/version.V=${GITHUB_REF_NAME#v}" -o ../desktop/src-tauri/proxy-${TRIPLE} ./cmd/proxy

      - name: Build Go sidecar (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          TRIPLE="x86_64-unknown-linux-gnu"
          cd ${{ env.GATEWAY }}
          go build -ldflags "-X github.com/XiaoleC05/Oxelia51/proxy-gateway/internal/version.V=${GITHUB_REF_NAME#v}" -o ../desktop/src-tauri/proxy-${TRIPLE} ./cmd/proxy

      - name: Install UI deps
        run: npm ci
        working-directory: ${{ env.UI_DIR }}

      - name: Build Tauri app
        working-directory: desktop
        # tauri CLI 需在 src-tauri 父目录运行（它只向下找 tauri.conf.json）
        run: npm exec --prefix ui -- tauri build --bundles ${{ matrix.bundles }}

      # Windows 便携版：把应用 exe + sidecar 打成一个免安装 zip（解压即用）。
      # sidecar 解析逻辑（lib.rs find_sidecar）会找 exe 同目录的 proxy.exe，故同一目录即可。
      # 用 powershell Compress-Archive 打真 zip（GNU tar 的 auto-compress 不支持 .zip，
      # 会产出「伪 .zip 的真 tar 文件」，Explorer/解压工具打不开）。
      - name: Package Windows portable ZIP
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          APP=$(find desktop/src-tauri/target -path "*/release/oxelia51-desktop.exe" | head -1)
          SIDECAR=$(find desktop -path "*proxy-x86_64-pc-windows-msvc.exe" | head -1)
          mkdir -p portable
          cp "$APP" portable/oxelia51.exe
          cp "$SIDECAR" portable/proxy.exe
          powershell -Command "Compress-Archive -Path 'portable\oxelia51.exe','portable\proxy.exe' -DestinationPath 'oxelia51-windows-portable.zip' -Force"
          cp oxelia51-windows-portable.zip desktop/dist/ 2>/dev/null || { mkdir -p desktop/dist && cp oxelia51-windows-portable.zip desktop/dist/; }
          echo "portable zip:"; ls -la desktop/dist/*.zip 2>/dev/null || true

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p desktop/dist
          # bundle 可能在 target/release 或 target/<triple>/release 下
          BUNDLES=""
          for d in desktop/src-tauri/target/release/bundle desktop/src-tauri/target/*/release/bundle; do
            [ -d "$d" ] && BUNDLES="$BUNDLES $d"
          done
          echo "bundle dirs:$BUNDLES" | tee -a "$GITHUB_STEP_SUMMARY"
          for d in $BUNDLES; do find "$d" -type f -print | tee -a "$GITHUB_STEP_SUMMARY"; done || true
          for d in $BUNDLES; do
            find "$d" -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) -exec cp {} desktop/dist/ \; 2>/dev/null || true
          done
          echo "dist:"; ls -la desktop/dist/ 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oxelia51-desktop-${{ matrix.platform }}
          path: desktop/dist/
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
