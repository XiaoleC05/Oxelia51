# Oxelia51 统一安全响应头（server 级与自带 add_header 的 location 都 include 本片段）。
# 背景：nginx 的 add_header 有继承陷阱——location 内一旦出现任意 add_header，
# server 级的全部 add_header 都不再继承，需在各 location 显式补回；
# 抽成 snippet 保证四处口径一致、只改一处。
# 部署路径约定：/opt/Oxelia51/deploy/nginx/ 下按仓库相对路径引用（include deploy/nginx/snippets/security-headers.conf）。
#
# 关于 X-Frame-Options（有意不在本片段下发）：
# web 页面（Next 应用层）已自行下发 SAMEORIGIN，若 nginx 再叠加 DENY 会产生两条冲突头，
# 且 DENY 会掐断 langfuse 上游可能的 iframe 嵌套能力——frame 策略由应用层说了算。
# /api/ 等 Go 接口响应对 frame 无诉求，不需要该头。故统一由应用层负责，本片段不再下发。
add_header Strict-Transport-Security "max-age=63072000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
