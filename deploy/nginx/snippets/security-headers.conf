# Oxelia51 统一安全响应头（server 级与自带 add_header 的 location 都 include 本片段）。
# 背景：nginx 的 add_header 有继承陷阱——location 内一旦出现任意 add_header，
# server 级的全部 add_header 都不再继承，需在各 location 显式补回；
# 抽成 snippet 保证四处口径一致、只改一处。
# 部署路径与 proxy-gateway.conf 的 include 约定一致：/opt/Oxelia51/deploy/nginx/ 下按仓库相对路径引用。
add_header Strict-Transport-Security "max-age=63072000" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
