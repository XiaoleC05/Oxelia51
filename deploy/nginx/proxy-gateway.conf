# =============================================
#  Go 代理网关 — Nginx location 片段
#  在 oxelia51.com server 块中 include 此文件
#  或在现有 location /api/ 之前插入
# =============================================
# 用法：在 /etc/nginx/sites-available/oxelia51.com.conf
#       的 server 块中添加：
#         include /opt/Oxelia51/deploy/nginx/proxy-gateway.conf;

# Token 代理 — 转发 LLM API 请求到 Go 代理网关
location /api/proxy/ {
    proxy_pass http://127.0.0.1:9090/api/proxy/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 不转发客户端 Authorization — Go 代理自己管理上游 API Key
    proxy_set_header Authorization "";

    # 支持 SSE 流式响应 — 关键配置
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;       # LLM 调用可能很长（10 分钟）
    proxy_send_timeout 600s;
    chunked_transfer_encoding on;

    # 大请求体（可能含 base64 图片等）
    client_max_body_size 50m;

    # 禁止缓存
    add_header Cache-Control "no-store" always;
    add_header X-Accel-Buffering "no" always;
}
