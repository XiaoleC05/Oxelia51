# Oxelia51 v3.0 — Langfuse 平台 + 后端 API + 工具代理

# 同步登录限流（防密码爆破）：仅 = /api/sync/login 使用。
# 本文件经 sites-enabled 包含在 http 上下文，zone 定义放 server 外合法。
limit_req_zone $binary_remote_addr zone=ox_sync_login:10m rate=10r/m;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name oxelia51.com www.oxelia51.com;

    ssl_certificate /etc/letsencrypt/live/oxelia51.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oxelia51.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ============================================================
    # Oxelia51 Go backend API
    # ============================================================

    # 代理网关（Go proxy-server :9090），鉴权透传 Authorization（代理 key）
    location /api/proxy/ {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
    }

    # Go backend login (must be before /api/auth/ → Langfuse proxy)
    location = /api/auth/login {
        proxy_pass http://127.0.0.1:8080/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # NextAuth endpoints → Langfuse
    location /api/auth/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # tRPC endpoints → Langfuse
    location /api/trpc/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # 桌面账本云同步 → Next.js :3000（web 自鉴权，不过 Go）
    # 账户收口 web 平台：login 验证平台注册凭证、签发长期 sync token；
    # upload/download 走 Bearer。最长前缀匹配，优先于下方 /api/ → Go。
    # ============================================================

    # 同步登录（签发 sync token）——限流防爆破
    location = /api/sync/login {
        limit_req zone=ox_sync_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        # location 自带 add_header 会丢弃 server 级安全头，显式补回
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 同步上传/下载（Bearer sync token）
    location /api/sync/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        client_max_body_size 5m;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
        # location 自带 add_header 会丢弃 server 级安全头，显式补回
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Go backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Oxelia51-Access-Token $http_x_oxelia51_access_token;
        # 安全：覆盖客户端可伪造的 X-Oxelia51-Client-IP，统一为 nginx 对端真实 IP
        proxy_set_header X-Oxelia51-Client-IP $remote_addr;
        client_max_body_size 500m;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    # ============================================================
    # Static files & webhook
    # ============================================================

    location /uploads/ {
        alias /opt/Oxelia51/uploads/;
        add_header Cache-Control "public, max-age=3600";
    }

    location /health {
        proxy_pass http://127.0.0.1:8080/api/health;
        allow 127.0.0.1;
        deny all;
    }

    location = /webhook {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }

    # ============================================================
    # Langfuse (Tencent Cloud via SSH tunnel)
    # ============================================================

    # Next.js static assets — HTML references absolute /_next/ paths
    location /_next/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Token Dashboard (legacy path)
    location /token/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        client_max_body_size 50m;
        proxy_redirect / /token/;
    }

    # Root → Langfuse
    location / {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        client_max_body_size 50m;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name oxelia51.com www.oxelia51.com;
    return 301 https://$host$request_uri;
}
