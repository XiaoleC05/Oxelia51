# Umami 统计面板 — stats.oxelia51.com → 127.0.0.1:3033
# 风格对齐 deploy/nginx/oxelia51.com.conf（ssl / 安全头 / 80 跳转）。
#
# 证书获取（首次启用前，二选一）：
#   a) webroot：certbot certonly --webroot -w /var/www/certbot -d stats.oxelia51.com
#      （先只启用下方 80 端口的 server 块，拿到证书后再启用 443 块）
#   b) certbot --nginx -d stats.oxelia51.com（让 certbot 自动改写本文件）

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stats.oxelia51.com;

    ssl_certificate /etc/letsencrypt/live/stats.oxelia51.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stats.oxelia51.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3033;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name stats.oxelia51.com;

    # certbot webroot 验证（方式 a）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
