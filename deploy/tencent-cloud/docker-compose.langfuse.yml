# =============================================
#  Oxelia51 v3.0 — Langfuse 数据层
#  服务器：腾讯云 118.25.138.177 (4C4G, Ubuntu 24.04)
#  当前 3 容器：postgres / clickhouse / web
#  注意：SmartKB PostgreSQL 已占 5433，
#        所以 Langfuse PostgreSQL 用 5434
#  Docker 镜像：腾讯云原生加速器 mirror.ccs.tencentyun.com
# =============================================
services:
  langfuse-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

    container_name: langfuse-postgres
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    volumes:
      - langfuse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 3s
      timeout: 3s
      retries: 10

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:25.12
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

    container_name: langfuse-clickhouse
    user: "101:101"
    deploy:
      resources:
        limits:
          # 2026-08-18 由 1G 升 2G：analytics 聚合积压时 1G 下 max_memory_usage(0.9G) 不够，
          # Step 1 聚合被 MEMORY_LIMIT_EXCEEDED 打断（需 ~1.5G）；2G 上限下 CH 自动 max_memory≈1.8G
          memory: 2G
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      TZ: Asia/Shanghai
    volumes:
      - langfuse_ch_data:/var/lib/clickhouse
      - langfuse_ch_logs:/var/log/clickhouse-server
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # langfuse-minio / langfuse-redis 已移除（2026-09-09）：仅服务已删的 tracing 功能
  # （S3 事件/媒体上传、BullMQ 队列），生产容器与数据卷已清理

  # langfuse-worker 已移除（2026-08-21）：仅服务已删的 tracing 功能，生产容器已停跑

  langfuse-web:
    image: crpi-6hx0lh969xz92v2y.cn-chengdu.personal.cr.aliyuncs.com/oxelia51/langfuse-token:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

    container_name: langfuse-web
    deploy:
      resources:
        limits:
          # 2026-08-05: 1.5G 时 Node 自动堆上限≈768M，启动即 OOM 崩溃（129 次重启）。
          # 2.5G + 显式 NODE_OPTIONS 堆上限 1.5G 后稳定。
          memory: 2.5G
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@langfuse-postgres:5432/${POSTGRES_DB:-postgres}
      SALT: ${SALT:?set SALT in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://${CLICKHOUSE_USER:-clickhouse}:${CLICKHOUSE_PASSWORD}@langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://${CLICKHOUSE_USER:-clickhouse}:${CLICKHOUSE_PASSWORD}@langfuse-clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      SMTP_CONNECTION_URL: ${SMTP_CONNECTION_URL:-}
      # 开放注册：邮箱验证防滥用（true 启用 OTP 注册流程）
      AUTH_EMAIL_VERIFICATION_REQUIRED: ${AUTH_EMAIL_VERIFICATION_REQUIRED:-false}
      NODE_OPTIONS: --max-old-space-size=1536
      # 后台管理：服务端持有 Go 运维凭证换 JWT 转发（不下发浏览器）
      OXELIA51_ADMIN_ACCOUNT: ${OXELIA51_ADMIN_ACCOUNT:?set in .env}
      OXELIA51_ADMIN_PASSWORD: ${OXELIA51_ADMIN_PASSWORD:?set in .env}
      # 管理员邮箱名单（空 = 无人是管理员，管理台关闭）。逗号分隔，须为已注册用户
      OXELIA51_ADMIN_EMAILS: ${OXELIA51_ADMIN_EMAILS:-}
      # 超级管理员邮箱（唯一可执行写操作的账户）。之前硬编码在 constants.ts 里，
      # 被打进了管理后台前端 JS bundle——2026-08-12 改为环境变量，必须显式配置。
      OXELIA_SUPER_ADMIN_EMAIL: ${OXELIA_SUPER_ADMIN_EMAIL:?set in .env}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-Oxelia51}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-default}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}

volumes:
  langfuse_pgdata:
    driver: local
  langfuse_ch_data:
    driver: local
  langfuse_ch_logs:
    driver: local
